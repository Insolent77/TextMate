<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TextMate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="top">
      <div>
        <h1>TextMate</h1>
        <p>AI-помощник для текста</p>
      </div>
      <span class="version">v0.9.1</span>
    </header>

    <section class="card">
      <label class="label" for="runMode">Режим работы</label>
      <select id="runMode">
        <option value="local">💻 Локальный AI — Ollama</option>
        <option value="cloud">☁ Облачный AI</option>
        <option value="rules">✓ Без AI — русский язык</option>
      </select>

      <div id="localSummary" class="summary">
        <div><span>Быстрая</span><strong>qwen3:0.6b</strong></div>
        <div><span>Качественная</span><strong>qwen3:1.7b</strong></div>
      </div>

      <div id="rulesSummary" class="summary hidden">
        <div><span>Обработка</span><strong>Локальный словарь</strong></div>
        <div><span>Язык</span><strong>Русский</strong></div>
        <div><span>Действие</span><strong>Только редактирование</strong></div>
        <div><span>Первый запуск</span><strong>Словарь ~4 МБ</strong></div>
      </div>

      <div id="cloudSummary" class="hidden">
        <label class="label compact" for="cloudProvider">Провайдер</label>
        <select id="cloudProvider">
          <option value="textmate">🌐 TextMate Global</option>
          <option value="openai-official">OpenAI API</option>
          <option value="gemini">Gemini API</option>
          <option value="openai-compatible">OpenAI-compatible</option>
        </select>
        <div id="cloudModels" class="summary"></div>
      </div>

      <button id="testConnection" class="secondary full" type="button">
        Проверить подключение
      </button>
      <p id="connectionStatus" class="status" role="status"></p>
    </section>

    <section id="quickActionsCard" class="card">
      <div class="sectionTitle">Быстрые действия</div>
      <p id="rulesActionsNote" class="status hidden">В режиме без AI доступно только «Редактировать».</p>
      <div class="checks">
        <label><input type="checkbox" data-action="edit"> Редактировать</label>
        <label><input type="checkbox" data-action="translate"> Перевод</label>
        <label><input type="checkbox" data-action="simplify"> Упростить</label>
        <label><input type="checkbox" data-action="shorten"> Короче</label>
        <label><input type="checkbox" data-action="polite"> Вежливее</label>
        <label><input type="checkbox" data-action="formal"> Официальнее</label>
        <label><input type="checkbox" data-action="rephrase"> Переформулировать</label>
      </div>

      <label class="toggleRow">
        <input id="autoCopyResult" type="checkbox">
        <span>
          <strong>Автокопирование</strong>
          <small>Копировать готовый результат автоматически</small>
        </span>
      </label>
    </section>

    <button id="advancedSettings" class="primary full" type="button">
      Расширенные настройки
    </button>

    <p id="saveStatus" class="saved">Настройки сохраняются автоматически</p>
  </main>

  <script src="compat.js"></script>
  <script src="popup.js"></script>
</body>
</html>
